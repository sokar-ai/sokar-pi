version: 2

# Every action is pinned to a commit, and a pin nobody moves rots. This is what moves them: each
# new release arrives as a pull request naming the new commit and its version, for a person to
# review. Nothing merges it automatically - the review is the point of the pin.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Move the pinned"
