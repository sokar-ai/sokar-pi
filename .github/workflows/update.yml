# Follows Pi and the tree's pins - Node, fd, ripgrep - so nobody has to. Each is its own job and its own
# pull request: one change to review, and a pin that fails its checks holds up nobody else.
name: Update

on:
  schedule:
    # Weekly, Monday morning UTC.
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      what:
        description: 'What to follow: all of them, or the CLI or one pin'
        type: choice
        options: [all, cli, node, fd, rg]
        default: all
      version:
        description: 'Pin this exact version instead of asking upstream - with one of them chosen above'
        required: false
      channel:
        description: "Which npm dist-tag to follow for the CLI when no version is given"
        required: false
        default: latest

# The permissions this workflow needs, and no more.
permissions:
  contents: write
  pull-requests: write

# Never two at once.
concurrency:
  group: update
  cancel-in-progress: false

jobs:

  update:
    name: Follow ${{ matrix.what }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # One at a time: each rents machines, and the second pull request is easier to rebase than to race.
      max-parallel: 1
      matrix:
        what: ${{ fromJSON((inputs.what && inputs.what != 'all') && format('["{0}"]', inputs.what) || '["cli","node","fd","rg"]') }}

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before the lookup, which is Sokar's release tool; and before anything is rented, so the
      # cleanup below always has something to run.
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'

      - name: Resolve the release and machine tooling
        run: |
          ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
              -Dmdep.outputFile=target/cp.txt

      # ------------------------------------------------------------------ detect

      # A version typed by hand means one thing only; for all four it would pin each of them to it.
      - name: What this job follows
        id: what
        env:
          WHAT: ${{ matrix.what }}
          VERSION: ${{ inputs.version }}
          ALL: ${{ !inputs.what || inputs.what == 'all' }}
        run: |
          set -eu
          if [ -n "${VERSION:-}" ] && [ "$ALL" = "true" ]; then
              echo "::error::a version is pinned for one of them - choose cli, node, fd or rg"
              exit 1
          fi
          # The label names it in the pull request, 'moved' is its component in the shipped tree's bill.
          case "$WHAT" in
              cli)  echo "label=Pi"      >> "$GITHUB_OUTPUT"; echo "moved=pi-coding-agent" >> "$GITHUB_OUTPUT" ;;
              node) echo "label=Node"    >> "$GITHUB_OUTPUT"; echo "moved=node"            >> "$GITHUB_OUTPUT" ;;
              fd)   echo "label=fd"      >> "$GITHUB_OUTPUT"; echo "moved=fd"              >> "$GITHUB_OUTPUT" ;;
              rg)   echo "label=ripgrep" >> "$GITHUB_OUTPUT"; echo "moved=ripgrep"         >> "$GITHUB_OUTPUT" ;;
              *)    echo "::error::nothing is followed as '$WHAT'"; exit 1 ;;
          esac

      # Through env, never interpolated into the script, so no value can become shell. The pom holds
      # each pin's upstream and line, and the age a release must reach before it is taken.
      - name: What does upstream publish
        id: detect
        env:
          WHAT: ${{ matrix.what }}
          CHANNEL: ${{ inputs.channel || 'latest' }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$WHAT" = "cli" ]; then
              set -- --channel "$CHANNEL"
          else
              set -- --pin "$WHAT"
          fi
          # A dispatch answers for the channel, so 'major' is still measured against what is pinned.
          if [ -n "${VERSION:-}" ]; then
              set -- "$@" --upstream "$VERSION"
          fi
          java -cp "$(cat target/cp.txt)" org.fuin.sokar.release.Main upstream-version "$@"

      - name: What this run will do
        id: plan
        env:
          UPDATE: ${{ steps.detect.outputs.update }}
          UPSTREAM: ${{ steps.detect.outputs.upstream }}
          PINNED: ${{ steps.detect.outputs.pinned }}
          SOURCE: ${{ steps.detect.outputs.source }}
          WAITING: ${{ steps.detect.outputs.waiting }}
          LABEL: ${{ steps.what.outputs.label }}
        run: |
          set -eu
          if [ "$UPDATE" = "yes" ]; then
              echo "target=$UPSTREAM" >> "$GITHUB_OUTPUT"
              echo "proceed=yes" >> "$GITHUB_OUTPUT"
              echo "This module pins $PINNED; the target is $UPSTREAM."
          elif [ "$UPDATE" = "rollback" ]; then
              # Nothing is built or rented: a verified downgrade is not what decides this.
              echo "proceed=no" >> "$GITHUB_OUTPUT"
              echo "STOP=$SOURCE points at $UPSTREAM, older than the pinned $PINNED" >> "$GITHUB_ENV"
              echo "Either upstream withdrew $PINNED, or it was pinned from another pointer."
              echo "To go back deliberately, dispatch this workflow for this one with version=$UPSTREAM."
              echo "Until one of the two moves, every scheduled run stops here."
          elif [ -n "${WAITING:-}" ]; then
              echo "proceed=no" >> "$GITHUB_OUTPUT"
              echo "$LABEL $UPSTREAM is out, but younger than the pom's sokar.release.min-age."
              echo "It is taken from $WAITING on. $PINNED stays pinned until then."
          else
              echo "proceed=no" >> "$GITHUB_OUTPUT"
              echo "$LABEL $PINNED is still what $SOURCE points at."
              echo "Nothing to do. This is the ordinary outcome of this job."
          fi

      # ------------------------------------------------------------------ apply

      - name: Pin it
        if: steps.plan.outputs.proceed == 'yes'
        env:
          WHAT: ${{ matrix.what }}
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -eu
          if [ "$WHAT" = "cli" ]; then
              java -cp "$(cat target/cp.txt)" org.fuin.sokar.release.Main update "$TARGET"
          else
              java -cp "$(cat target/cp.txt)" org.fuin.sokar.release.Main update "$TARGET" --pin "$WHAT"
          fi

      # ------------------------------------------------------------------ verify

      # Gates write STOP rather than failing, so the run can still clean up after itself.
      - name: Unit tests
        if: steps.plan.outputs.proceed == 'yes'
        run: |
          ./mvnw -B -s settings.xml verify || echo "STOP=the unit suite failed" >> "$GITHUB_ENV"

      # Not -DskipTests: it would skip the checks that need the binary and the built tree, which are
      # what a new version most needs asked.
      - name: Native binary and packages
        if: steps.plan.outputs.proceed == 'yes' && !env.STOP
        run: |
          ./mvnw -B -s settings.xml -Pnative,dist verify \
              -Dagent.snapshot.run=${{ github.run_number }} \
              || echo "STOP=the packages did not build" >> "$GITHUB_ENV"

      # What moved carries its version in its purl, so without --expect-moved this stops every time.
      # Nothing else is excused, which is the point.
      - name: What else changed in the shipped tree
        if: steps.plan.outputs.proceed == 'yes' && !env.STOP
        env:
          MOVED: ${{ steps.what.outputs.moved }}
        run: |
          java -cp "$(cat target/cp.txt)" org.fuin.sokar.release.Main compare-bills \
              target/sokar-agent-pi.cdx.json \
              https://fuinorg.jfrog.io/artifactory/sokar-dist-deb/pool/main/s/sokar-agent-pi/sokar-agent-pi.cdx.json \
              --expect-moved "$MOVED" \
              > target/bill-change.txt 2>&1 \
              || echo "STOP=third-party components or licenses changed" >> "$GITHUB_ENV"
          # In a file as well, so the pull request can carry it rather than only the run log.
          cat target/bill-change.txt

      - name: The major version moved
        if: steps.plan.outputs.proceed == 'yes' && steps.detect.outputs.major == 'moved'
        env:
          WAS: ${{ steps.detect.outputs.pinned }}
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          echo "STOP=the upstream major version moved" >> "$GITHUB_ENV"
          echo "::warning::$WAS -> $TARGET"
          echo "A major release changes flags, configuration or an extension API by definition."

      - name: Acceptance - ubuntu
        if: steps.plan.outputs.proceed == 'yes' && !env.STOP
        env:
          HETZNER_API: ${{ secrets.HETZNER_API }}
          HETZNER_SSH: ${{ secrets.HETZNER_SSH }}
          SOKAR_CI_LEG: upd-${{ matrix.what }}-ubuntu
          SOKAR_E2E_OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          SOKAR_E2E_MODEL: z-ai/glm-4.6
          # Only when the CLI is what moved; a pin run installs the CLI that is already pinned.
          SOKAR_E2E_EXPECT_CLI: ${{ matrix.what == 'cli' && steps.plan.outputs.target || '' }}
        run: |
          java -cp "$(cat target/cp.txt)" org.fuin.sokar.machines.Main acceptance \
              --os ubuntu --package sokar-agent-pi \
              --cucumber . --candidate target \
              || echo "STOP=acceptance failed on ubuntu" >> "$GITHUB_ENV"

      - name: Acceptance - fedora
        if: steps.plan.outputs.proceed == 'yes' && !env.STOP
        env:
          HETZNER_API: ${{ secrets.HETZNER_API }}
          HETZNER_SSH: ${{ secrets.HETZNER_SSH }}
          SOKAR_CI_LEG: upd-${{ matrix.what }}-fedora
          SOKAR_E2E_OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          SOKAR_E2E_MODEL: z-ai/glm-4.6
          # Only when the CLI is what moved; a pin run installs the CLI that is already pinned.
          SOKAR_E2E_EXPECT_CLI: ${{ matrix.what == 'cli' && steps.plan.outputs.target || '' }}
        run: |
          java -cp "$(cat target/cp.txt)" org.fuin.sokar.machines.Main acceptance \
              --os fedora --package sokar-agent-pi \
              --cucumber . --candidate target \
              || echo "STOP=acceptance failed on fedora" >> "$GITHUB_ENV"

      - name: Delete what this run created
        if: always() && steps.plan.outputs.proceed == 'yes'
        env:
          HETZNER_API: ${{ secrets.HETZNER_API }}
          SOKAR_CI_LEG: upd-${{ matrix.what }}-ubuntu
        run: java -cp "$(cat target/cp.txt)" org.fuin.sokar.machines.Main sweep --mine || true

      - name: Delete what this run created - fedora leg
        if: always() && steps.plan.outputs.proceed == 'yes'
        env:
          HETZNER_API: ${{ secrets.HETZNER_API }}
          SOKAR_CI_LEG: upd-${{ matrix.what }}-fedora
        run: java -cp "$(cat target/cp.txt)" org.fuin.sokar.machines.Main sweep --mine || true

      # ------------------------------------------------------------------ ask, or publish

      - name: Open the pull request
        id: request
        if: always() && steps.plan.outputs.proceed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.plan.outputs.target }}
          WAS: ${{ steps.detect.outputs.pinned }}
          WHAT: ${{ matrix.what }}
          LABEL: ${{ steps.what.outputs.label }}
        run: |
          set -eu
          git config user.name 'sokar-update'
          git config user.email 'noreply@fuin.org'
          if git diff --quiet; then
              echo "nothing was written - there is no change to propose"
              exit 0
          fi
          BRANCH="update/$WHAT-$TARGET"
          git checkout -b "$BRANCH"
          git commit -am "Pin $LABEL $TARGET"
          git push --force origin "$BRANCH"

          {
            if [ "$WHAT" = "cli" ]; then
                echo "\`$WAS\` -> \`$TARGET\`, applied by Sokar's release tool: the"
                echo "\`agent.cli.version\` property, the npm manifest, and the lockfile regenerated"
                echo "by the pinned npm. Everything else naming the version is filtered from the"
                echo "property and could not drift."
            else
                echo "$LABEL \`$WAS\` -> \`$TARGET\`, applied by Sokar's release tool: the"
                echo "\`pin.$WHAT.*\` properties in \`pom.xml\`, with the digest read from upstream."
                echo "\`build-pi-tree.sh\` gets them from there and checks the download against it."
            fi
            echo
            if [ -n "${STOP:-}" ]; then
                echo "**This is not ready to publish: $STOP.**"
                echo "Automation is not allowed to decide this one - see the run log above."
                if [ -s target/bill-change.txt ]; then
                    echo
                    echo "<details><summary>What changed in the shipped tree</summary>"
                    echo
                    echo '```'
                    cat target/bill-change.txt
                    echo '```'
                    echo
                    echo "</details>"
                fi
            else
                echo "**Green.** Unit suite, the pin check against the published manifest, both"
                echo "packages, an unchanged third-party component set, and the acceptance suites"
                echo "on Ubuntu and Fedora against these packages rather than the published ones."
            fi
          } > /tmp/body.md
          # A weekly job reaches the same version twice whenever the first attempt stopped.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
              gh pr comment "$BRANCH" --body-file /tmp/body.md
              echo "the request for $TARGET was already open - re-verified, and said so on it"
          else
              gh pr create --title "Pin $LABEL $TARGET" --body-file /tmp/body.md \
                           --head "$BRANCH" --base main
          fi
          echo "opened=yes" >> "$GITHUB_OUTPUT"

      # Auto-merge needs its own token: the default one does not trigger a further workflow.
      - name: Merge, or say why not
        if: always() && steps.request.outputs.opened == 'yes'
        env:
          GH_TOKEN: ${{ secrets.SOKAR_UPDATE_TOKEN || github.token }}
          AUTO: ${{ vars.SOKAR_UPDATE_AUTO_MERGE }}
          HAVE_TOKEN: ${{ secrets.SOKAR_UPDATE_TOKEN != '' }}
          TARGET: ${{ steps.plan.outputs.target }}
          WHAT: ${{ matrix.what }}
          LABEL: ${{ steps.what.outputs.label }}
        run: |
          set -eu
          if [ -n "${STOP:-}" ]; then
              echo "Not merging: $STOP."
              echo "The branch is open for whoever decides it."
          elif [ "$AUTO" != "true" ]; then
              echo "Not merging: the repository variable SOKAR_UPDATE_AUTO_MERGE is '${AUTO:-unset}'."
              echo "Everything passed. Merging the pull request publishes $LABEL $TARGET."
              echo "Set the variable to 'true' when these runs have been watched enough."
          elif [ "$HAVE_TOKEN" != "true" ]; then
              echo "::error::SOKAR_UPDATE_AUTO_MERGE is on but the secret SOKAR_UPDATE_TOKEN is not set."
              echo "Merging with the workflow's own token triggers no build, so nothing would be"
              echo "published and the run would look successful. Refusing to merge."
              exit 1
          else
              gh pr merge --merge --delete-branch "update/$WHAT-$TARGET"
              echo "Merged. The push to main builds and publishes $LABEL $TARGET."
          fi

      # Red means there is something to look at, and only that.
      - name: Stop
        if: always() && env.STOP
        run: |
          echo "::error::$STOP"
          exit 1
