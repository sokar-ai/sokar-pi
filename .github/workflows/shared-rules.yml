# The marked rule blocks in AGENTS.md are shared copies; a hash that no longer fits its text means one
# was edited alone. Beside it the shared document checks: citations of issues in any page or source, and
# the documentation chapter, and the tests tagged documents. A job of its own, so a document-only change
# checks them without leasing machines; on every path, since a citation can land in any file.
name: Shared rules check
run-name: "${{ github.workflow }} · ${{ github.ref_name }}: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}"

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# Read by every Maven call, the pinned-jdk action's too: Maven asks for a newer snapshot once a day, and a
# cache restored the day Sokar publishes would keep yesterday's. Never run on a tag.
env:
  MAVEN_ARGS: -U

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  check-shared:
    name: Every shared rules block is unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The pinned GraalVM
        uses: ./.github/actions/pinned-jdk

      - name: Resolve the release tooling
        run: |
          ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
              -Dmdep.outputFile=target/cp.txt

      - name: Every shared rules block is unchanged
        run: java -cp "$(cat target/cp.txt)" org.fuin.sokar.release.Main check-shared AGENTS.md

      - name: No issue is cited by its file or by a number that is gone
        run: java -cp "$(cat target/cp.txt)" org.fuin.sokar.release.Main check-citations .

      - name: Every page of the documentation chapter is in its navigation once
        run: java -cp "$(cat target/cp.txt)" org.fuin.sokar.release.Main check-doc-site doc mkdocs.yml

      - name: Every module directory has a README that links its submodules
        run: java -cp "$(cat target/cp.txt)" org.fuin.sokar.release.Main check-readmes .

      - name: The tests that read a document
        run: ./mvnw -B -s settings.xml -Pdocuments test
